name: GOB checks

on:
  push:
    branches: [main, phase-1-foundation-storefront]
  pull_request:
    branches: [main, phase-1-foundation-storefront]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
